# IoT Defense System Configuration
# Main configuration for Adversarial RL Defense System
#
# System Overview:
# - Markov Attacker: first-order tug-of-war kill-chain process
# - Blue Team: RL agents (DQN/PPO/A2C) learn defense policies
# - Kill Chain Stages: BENIGN(0), RECON(1), ACCESS(2), MANEUVER(3), IMPACT(4)

# Dataset Configuration
dataset:
  name: "CICIoT2023"
  raw_path: "data/raw/CICIoT2023"
  processed_path: "data/processed/ciciot2023"
  sample_size: 500_000 # Start with 500K samples for manageable training
  sampling_mode: "smart_balanced" # Smart class-aware sampling with benign quota + derived attack cap
  benign_target_count: 100_000 # Keep ~20% benign to preserve normal behavior signal
  max_samples_per_attack_class: null # null -> derive cap from remaining budget / attack classes
  sequence_length: 5 # EDA recommendation
  train_split: 0.7
  val_split: 0.1
  test_split: 0.2
  # Data quality and feature engineering
  sampling_strategy: "balanced" # For severe imbalance (1059:1 ratio)
  min_samples_per_stage: 2000 # Floor per Kill Chain stage in env dataset (prevents ACCESS pool starvation)
  feature_selection: true # Remove low/zero variance features
  variance_threshold: 0.01 # Remove features with variance < 0.01
  correlation_threshold: 0.95 # Remove redundant features with corr > 0.95
  feature_keep_keywords: # Preserve rate/frequency features during selection
    - "rate"
    - "per_second"
    - "pps"
    - "packets_per_second"
    - "bytes_per_second"
    - "frequency"

# =============================================================================
# ADVERSARIAL ENVIRONMENT (BLUE TEAM TRAINING)
# =============================================================================

# Adversarial Environment Configuration
# Agent observes realized feature vectors, hidden attack state is not visible
adversarial_environment:
  max_steps: 500 # Steps per episode
  observation:
    # Box observation space: window of realized features
    window_size: 5 # Number of previous observations in window
    include_deltas: true # Append delta (velocity) features
    # Feature dimension determined at runtime from dataset

  # Force Continuum Actions (5 discrete levels)
  # Higher levels = more defensive but more costly
  actions:
    num_actions: 5
    levels:
      - name: "OBSERVE"
        description: "Passive monitoring, no intervention"
        cost: 0.0
      - name: "LOG"
        description: "Enhanced logging, minimal impact"
        cost: 0.1
      - name: "RESTRICT"
        description: "Rate limiting suspicious traffic"
        cost: 0.3
      - name: "BLOCK"
        description: "Block suspicious IPs/connections"
        cost: 0.5
      - name: "ISOLATE"
        description: "Isolate affected systems"
        cost: 0.8

  # Reward Function: R_t = R_defense - C_action - P_impact
  reward:
    # C_action: cost of defensive actions (from actions.levels.cost)
    action_cost_scale: 1.0

    # P_impact: penalty applied during the agent's final action at the IMPACT stage.
    # Must vastly exceed penalty_block_benign (100.0) so a system breach is always
    # the worst possible outcome and agents are incentivised to BLOCK/ISOLATE earlier.
    impact_penalty: 200.0

    # Bonus for successfully defending (attack terminates at lower stage)
    defense_success_bonus: 250.0
    # Strong penalty for RESTRICT/BLOCK/ISOLATE during BENIGN traffic
    penalty_overreact_benign: 50.0
    # Additional surcharge for BLOCK/ISOLATE on BENIGN
    penalty_block_benign: 100.0
    penalty_block_recon: 50.0
    # Strong penalty for OBSERVE/LOG when stage is IMPACT
    penalty_missed_impact: 150.0
    # Positive reward for allowing BENIGN traffic with OBSERVE/LOG
    reward_benign_passive: 10.0

  # Partial-observability redesign (canonical regime)
  redesign:
    reward_mode: outcome
    aliasing_rate: 0.0  # headline: 0.4
    session_coherent: false  # headline: true
    proximity_coupled: false  # headline: true
    proximity_min_escalation: 0.4  # sigma_min
    impact_is_terminal: false
    prevention_bonus: 50.0
    p_onset: 0.35
    p_onset_access: 0.10
    p_down: 0.90
    p_up: 0.90
    p_down_isolate: 0.98

# RL Training Configuration
rl:
  algorithm: "ppo" # Options: dqn, ppo, a2c

  training:
    total_timesteps: 500000 # Full training run target for PPO convergence
    eval_freq: 5000
    n_eval_episodes: 10
    save_freq: 12500

  # Algorithm-specific hyperparameters
  algorithms:
    dqn:
      learning_rate: 1e-4
      buffer_size: 50000 # Adjusted for sample size
      learning_starts: 1000
      batch_size: 32
      tau: 1.0
      gamma: 0.99
      train_freq: 4
      gradient_steps: 1
      target_update_interval: 1000
      exploration_fraction: 0.1
      exploration_initial_eps: 1.0
      exploration_final_eps: 0.05
      max_grad_norm: 10

    ppo:
      learning_rate: 3e-4
      n_steps: 2048
      batch_size: 64
      n_epochs: 10
      gamma: 0.99
      gae_lambda: 0.95
      clip_range: 0.2
      clip_range_vf: null
      normalize_advantage: true
      ent_coef: 0.0
      vf_coef: 0.5
      max_grad_norm: 0.5

    a2c:
      learning_rate: 7e-4
      n_steps: 5
      gamma: 0.99
      gae_lambda: 1.0
      ent_coef: 0.0
      vf_coef: 0.5
      max_grad_norm: 0.5
      rms_prop_eps: 1e-5
      use_rms_prop: true
      use_sde: false

# Model Paths
models:
  # RL Agent (Blue Team)
  rl:
    save_dir: "artifacts/rl"
    checkpoint_dir: "artifacts/rl/checkpoints"

# Experiment Tracking
mlflow:
  tracking_uri: "mlruns"
  experiment_name: "iot_defense_system"

# Logging Configuration
logging:
  level: "INFO"
  log_dir: "results/logs"

# Results Configuration
results:
  plots_dir: "results/plots"
  reports_dir: "results/reports"

# Benchmark configuration
benchmark:
  # Optional: point to a processed holdout split path if maintained separately.
  # Falls back to dataset.processed_path when null.
  holdout_dataset_path: null
  supervised_baselines:
    enabled: false
    # Each entry should point to a JSON file with at least:
    # {"name": "RandomForest", "detection_recall_by_stage": {"0":..,"1":..,"2":..,"3":..,"4":..}, "benign_fpr": .., "macro_f1": ..}
    entries: []
