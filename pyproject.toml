# =============================================================================
# Tool configuration for the RL IoT Defense System.
#
# We do NOT package the project here (no [project]/setuptools sections); this
# file only configures developer tooling (ruff, black, isort, pytest, mypy).
# Add a [project] section if/when we ship a pip-installable package.
# =============================================================================

[tool.black]
line-length = 100
target-version = ["py39"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.venv
  | \.git
  | build
  | dist
  | data
  | mlruns
  | artifacts
  | runs
  | results
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src", "tests"]
skip_gitignore = true
skip = ["data", "mlruns", "artifacts", "runs", "results", ".venv"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
    "data",
    "mlruns",
    "artifacts",
    "runs",
    "results",
    "notebooks",
    ".venv",
]

[tool.ruff.lint]
# Pragmatic defaults for a research codebase: enforce errors, basic
# pyflakes/pycodestyle, isort, and bugbear; tolerate scientific naming.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "C4",   # comprehensions
    "SIM",  # simplification hints
]
ignore = [
    "E501",  # line length handled by black
    "B008",  # function calls in default args (Gym/SB3 patterns)
    "N806",  # variable lowercase rule (X_train, y_test, ...)
    "N803",  # argument lowercase rule
    "SIM117",  # nested with statements
]

[tool.ruff.lint.per-file-ignores]
"tests/*"     = ["N802", "N803", "N806"]
"notebooks/*" = ["E402", "F401", "F811"]
"scripts/*"   = ["E402"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_optional = true
exclude = "(data|mlruns|artifacts|runs|results|notebooks)/"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/notebooks/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true

# NOTE: pytest configuration lives in pytest.ini (single source of truth).
# pytest ignores [tool.pytest.ini_options] whenever pytest.ini is present, so
# duplicating it here would silently drift; keep pytest settings in pytest.ini.
